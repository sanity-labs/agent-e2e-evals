#:schema https://fnox.jdx.dev/schema.json

default_provider = "op"

[providers.op]
type = "1password"
vault = "Dev Secrets"

[secrets]
# Required for vercel-ai-gateway agents and failure classification
AI_GATEWAY_API_KEY = { provider = "op", value = "agent-evals-exploration ai-gateway-api-key/password", if_missing = "warn" }

# Direct provider API keys (optional, only needed if not using AI Gateway)
ANTHROPIC_API_KEY = { provider = "op", value = "agent-evals-exploration anthropic-api-key/password", if_missing = "warn" }
OPENAI_API_KEY = { provider = "op", value = "agent-evals-exploration openai-api-key/password", if_missing = "warn" }
CURSOR_API_KEY = { provider = "op", value = "agent-evals-exploration cursor-api-key/password", if_missing = "warn" }
GEMINI_API_KEY = { provider = "op", value = "agent-e2e-evals gemini-api-key/password", if_missing = "warn" }

# Sanity MCP experiments
SANITY_AUTH_TOKEN = { provider = "op", value = "agent-e2e-evals sanity-staging-auth-token/password" }
SANITY_MCP_URL = { default = "https://mcp.sanity.work/" }

# Vercel Sandbox config - unused if you don't provide VERCEL_TOKEN/VERCEL_OIDC_TOKEN
VERCEL_PROJECT_ID = { default = "prj_nkvmq75NiBAHvalqCiwEw18MoEn6" }
VERCEL_TEAM_ID = { default = "team_oqU06TUi6OGH315dQZ2wFh08" }

# Local scripts
SANITY_INTERNAL_ENV = { default = "staging" }
EVALS_SERVICE_ACCOUNT_EMAIL = { provider = "op", value = "mellon evals service account/username", if_missing = "warn" }
EVALS_SERVICE_ACCOUNT_PASSWORD = { provider = "op", value = "mellon evals service account/password", if_missing = "warn" }
RECAPTCHA_BYPASS_KEY = { provider = "op", value = "Legion E2E staging reCAPTCHA bypass token/password", if_missing = "warn" }
SANITY_API_HOST = { default = "https://api.sanity.work" }
