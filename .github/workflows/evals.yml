name: Evals

on:
  workflow_dispatch:
    inputs:
      experiments:
        description: 'Comma-separated experiment names (empty = all)'
        type: string
        default: ''
      force:
        description: 'Bypass fingerprint cache and re-run everything'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  versions:
    name: Read tool versions
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.read.outputs.node }}
      pnpm: ${{ steps.read.outputs.pnpm }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1

      - id: read
        run: |
          echo "node=$(mise tool node --requested)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(mise tool pnpm --requested)" >> "$GITHUB_OUTPUT"

  run-evals:
    name: Run agent evals
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Generate Squiggler app token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.ECOSPARK_APP_ID }}
          private-key: ${{ secrets.ECOSPARK_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: ${{ needs.versions.outputs.pnpm }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ needs.versions.outputs.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run agent-eval
        id: run-evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          SANITY_MCP_URL: https://mcp.sanity.work/
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          EXPERIMENTS: ${{ inputs.experiments }}
          FORCE: ${{ inputs.force }}
        run: |
          set -uo pipefail
          ARGS=()
          EXPS_ARGS=()
          if [[ -n "${EXPERIMENTS}" ]]; then
            IFS=',' read -ra EXPS <<< "${EXPERIMENTS}"
            for exp in "${EXPS[@]}"; do
              trimmed="$(echo "${exp}" | xargs)"
              [[ -n "${trimmed}" ]] && EXPS_ARGS+=("${trimmed}")
            done
          else
            EXPS_ARGS=("*")
          fi
          mkdir -p results
          set +e
          ARGS+=("${EXPS_ARGS[@]}")
          [[ "${FORCE}" == "true" ]] && ARGS+=("--force")
          pnpm exec agent-eval run "${ARGS[@]}"
          status=$?
          set -e
          echo "exit-code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Export results
        if: ${{ always() }}
        run: pnpm run export-results

      - name: Redact raw eval results
        if: ${{ always() }}
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: pnpm run redact-results

      - name: Upload raw eval results artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results-raw-${{ github.run_id }}
          path: results
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit and push published results
        if: ${{ always() }}
        run: |
          set -euo pipefail
          git config user.name 'squiggler-app[bot]'
          git config user.email '265501495+squiggler-app[bot]@users.noreply.github.com'
          git add published/
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
            exit 0
          fi
          git commit -m 'chore(published): refresh eval results [skip ci]'
          git pull --rebase
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Cleanup eval projects
        if: ${{ always() }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVALS_SERVICE_ACCOUNT_EMAIL: ${{ vars.EVALS_SERVICE_ACCOUNT_EMAIL }}
          EVALS_SERVICE_ACCOUNT_PASSWORD: ${{ secrets.EVALS_SERVICE_ACCOUNT_PASSWORD }}
          RECAPTCHA_BYPASS_KEY: ${{ secrets.RECAPTCHA_BYPASS_KEY }}
        run: pnpm run cleanup-eval-projects --delete

      - name: Report eval exit status
        if: ${{ always() }}
        env:
          EVAL_EXIT_CODE: ${{ steps.run-evals.outputs.exit-code }}
        run: |
          set -euo pipefail
          echo "agent-eval exit code: ${EVAL_EXIT_CODE:-unknown}"
          if [[ "${EVAL_EXIT_CODE:-0}" != "0" ]]; then
            echo "agent-eval reported failures; failing the job after publishing results."
            exit 1
          fi
